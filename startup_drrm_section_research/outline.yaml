topic: "Evidence-grounded enhancement of the objectives, scope and limitations, and significance of a startup-operated multi-organization Philippine DRRM SitRep platform"
items:
  - name: "DRRM SitRep workflow incident command and interoperability"
    category: "Philippine operational framework"
    description: "RA 10121, 2024 NDRRMOC SOPG, Operation L!STO, Philippine Incident Command System evidence, ISO 22320, report stages, source authority, jurisdiction, operational periods, SitRep categories, conflict reconciliation, identifiers, controlled vocabularies, CAP boundaries, and external-system interoperability limits."
  - name: "Privacy public records electronic evidence and disclosure"
    category: "Philippine legal and records framework"
    description: "RA 10173 and NPC issuances, RA 9470, RA 8792, data classification, lawful purpose, sensitive disaster information, controller-processor roles, support access, approval evidence, report lineage, retention, legal holds, archival custody, public disclosure, export, and lawful disposition."
  - name: "Multi-tenant security startup governance and service continuity"
    category: "Shared public-sector digital service"
    description: "Tenant isolation, object authorization, cross-tenant threats, malicious files, exports, logs, support accounts, ransomware, denial of service, backups, recovery objectives, provider failure, subprocessors, service levels, portability, transition assistance, and customer-startup responsibility boundaries."
  - name: "Connectivity accessibility inclusion and degraded operation"
    category: "Inclusive and resilient access"
    description: "RA 12234, RA 12254, WCAG 2.2, Philippine connectivity constraints, responsive browser access, low-bandwidth behavior, interrupted requests, draft preservation, retry and reconciliation, approved non-digital contingencies, disability access, language, geographic and demographic underrepresentation, and re-identification risk."
  - name: "Information quality workflow effectiveness and prototype evaluation"
    category: "Academic evidence and measurement"
    description: "Primary disaster-information and situational-awareness studies, ISO 25010:2023, ISO 25012:2008, SUS, provenance, completeness, accuracy, currentness, consistency, duplicates, conflicts, baseline workflow comparison, task scenarios, accessibility testing, aggregation accuracy, uncertainty, effect interpretation, and attribution limits."
  - name: "Public-sector adoption procurement and startup viability"
    category: "Institutional and commercial feasibility"
    description: "RA 12009, GovTech procurement, RA 12254 startup collaboration, organizational readiness, training, staff turnover, workflow fit, support, lifecycle cost, portability, termination, subcontractors, willingness to use versus willingness to pay, procurement readiness, market evidence, generalization, and defensible significance claims."
execution:
  batch_size: 3
  items_per_agent: 1
  output_dir: "startup_drrm_section_research/results_v2"

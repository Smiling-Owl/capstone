    <line class="processRule" x1="710" y1="220" x2="1010" y2="220"/>
    <text class="pid" x="724" y="209">2.0</text>
    <text class="pname" x="860" y="249">Authenticate and</text>
    <text class="pname" x="860" y="270">Authorize Access</text>
  </g>
  <g id="process-3">
    <rect class="process" x="1110" y="185" width="300" height="105" rx="15"/>
    <line class="processRule" x1="1110" y1="220" x2="1410" y2="220"/>
    <text class="pid" x="1124" y="209">3.0</text>
    <text class="pname" x="1260" y="247">Maintain and Verify CDRA</text>
    <text class="pname" x="1260" y="268">Baseline Profiles</text>
  </g>
  <g id="process-4">

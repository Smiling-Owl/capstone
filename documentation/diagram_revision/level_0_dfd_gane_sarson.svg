    <text class="pname" x="1200" y="797">Generate, Review, and</text>
    <text class="pname" x="1200" y="818">Approve City SitReps</text>
  </g>

  <!-- Gane–Sarson open-ended data stores -->
  <g id="store-d2">
    <path class="store" d="M310 315 H610 M310 375 H610 M310 315 V375 M352 315 V375"/>
    <text class="sid" x="320" y="351">D2</text><text class="sname" x="365" y="343">Organizations and</text><text class="sname" x="365" y="360">Jurisdictions</text>
  </g>
  <g id="store-d1">
    <path class="store" d="M710 315 H1010 M710 375 H1010 M710 315 V375 M752 315 V375"/>

    <line class="processRule" x1="330" y1="495" x2="630" y2="495"/>
    <text class="pid" x="344" y="484">4.0</text>
    <text class="pname" x="480" y="524">Capture and Version</text>
    <text class="pname" x="480" y="545">Purok Reports</text>
  </g>
  <g id="process-5">
    <rect class="process" x="690" y="460" width="300" height="105" rx="15"/>
    <line class="processRule" x1="690" y1="495" x2="990" y2="495"/>
    <text class="pid" x="704" y="484">5.0</text>
    <text class="pname" x="840" y="524">Review and Consolidate</text>
    <text class="pname" x="840" y="545">Barangay Reports</text>
  </g>
  <g id="process-6">
    <rect class="process" x="1050" y="460" width="300" height="105" rx="15"/>
    <line class="processRule" x1="1050" y1="495" x2="1350" y2="495"/>
    <text class="pid" x="1064" y="484">6.0</text>
    <text class="pname" x="1200" y="524">Verify and Reconcile</text>
    <text class="pname" x="1200" y="545">Barangay Reports</text>
  </g>
  <g id="process-8">

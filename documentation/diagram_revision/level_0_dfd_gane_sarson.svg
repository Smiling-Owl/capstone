  </g>

  <!-- Actor/process data flows. Bidirectional lines are paired, separately named flows expanded in the dictionary. -->
  <path class="pair" d="M280 806 H300 V238 H310"/>
  <rect class="labelBg" x="288" y="720" width="34" height="20"/><text class="flowLabel" x="296" y="735">F1</text>
  <path class="pair" d="M1640 470 H1570 V140 H460 V185"/>
  <rect class="labelBg" x="1010" y="128" width="180" height="20"/><text class="flowLabel" x="1017" y="143">F1 · access configuration / status</text>

  <path class="pair" d="M280 475 H300 V400 H665 V238 H710"/>
  <rect class="labelBg" x="430" y="388" width="205" height="20"/><text class="flowLabel" x="438" y="403">F2 · credentials / authorization result</text>
  <path class="pair" d="M280 820 H650 V400 H685 V238 H710"/>
  <rect class="labelBg" x="410" y="808" width="34" height="20"/><text class="flowLabel" x="418" y="823">F2</text>
  <path class="pair" d="M1640 490 H1585 V395 H1028 V238 H1010"/>
  <rect class="labelBg" x="1380" y="383" width="34" height="20"/><text class="flowLabel" x="1388" y="398">F2</text>

  <path class="pair" d="M280 500 H300 V405 H1070 V238 H1110"/>
  <rect class="labelBg" x="900" y="393" width="145" height="20"/><text class="flowLabel" x="908" y="408">F3 · CDRA baseline package</text>
  <path class="pair" d="M280 790 H315 V420 H1055 V260 H1110"/>
  <rect class="labelBg" x="320" y="407" width="204" height="20"/><text class="flowLabel" x="328" y="422">F4 · profile review / correction status</text>
  <path class="pair" d="M1640 510 H1550 V260 H1410"/>
  <rect class="labelBg" x="1435" y="248" width="100" height="20"/><text class="flowLabel" x="1443" y="263">F4 · verification</text>

  <path class="pair" d="M280 491 H330"/>
  <rect class="labelBg" x="286" y="468" width="190" height="20"/><text class="flowLabel" x="294" y="483">F5 · Purok report package / status</text>
  <path class="flow" d="M630 512 H690"/>
  <rect class="labelBg" x="620" y="540" width="105" height="20"/><text class="flowLabel" x="628" y="555">F5 · submitted version</text>
  <path class="pair" d="M280 806 H660 V512 H690"/>
  <rect class="labelBg" x="435" y="792" width="184" height="20"/><text class="flowLabel" x="443" y="807">F6 · review / consolidation</text>
  <path class="flow" d="M990 512 H1050"/>
  <rect class="labelBg" x="975" y="540" width="120" height="20"/><text class="flowLabel" x="983" y="555">F6 · Barangay report</text>
  <path class="pair" d="M1640 491 H1350"/>
  <rect class="labelBg" x="1378" y="468" width="214" height="20"/><text class="flowLabel" x="1386" y="483">F7 · verification / reconciliation package</text>
  <path class="flow" d="M1350 540 H1435 V787 H1350"/>
  <rect class="labelBg" x="1442" y="650" width="142" height="36"/><text class="flowLabel" x="1450" y="665">F8 · verified SitRep</text><text class="flowLabel" x="1450" y="680">source snapshot</text>
  <path class="pair" d="M1745 527 V787 H1350"/>
  <rect class="labelBg" x="1550" y="772" width="172" height="36"/><text class="flowLabel" x="1558" y="787">F9 · SitRep review / approval</text><text class="flowLabel" x="1558" y="802">package, draft, export</text>
  <path class="pair" d="M1780 527 V1080 H840 V840"/>
  <rect class="labelBg" x="1080" y="1067" width="314" height="20"/><text class="flowLabel" x="1088" y="1082">F10 · authorized query / records / maps / analytics</text>

  <!-- Process/store data flows -->
  <path class="flow" d="M430 290 V315"/><text class="flowLabel" x="382" y="307">F11</text>
  <path class="flow" d="M520 290 V300 H860 V315"/><text class="flowLabel" x="650" y="298">F11</text>
  <path class="flow" d="M860 315 V290"/><text class="flowLabel" x="870" y="307">F11</text>
  <path class="pair" d="M1260 290 V315"/><text class="flowLabel" x="1270" y="307">F12</text>
  <path class="flow" d="M1410 250 H1450 V345 H1470"/><text class="flowLabel" x="1425" y="300">F12</text>
  <path class="pair" d="M480 565 V590"/><text class="flowLabel" x="490" y="582">F13</text>
  <path class="pair" d="M840 565 V590"/><text class="flowLabel" x="850" y="582">F13</text>
  <path class="pair" d="M1200 565 V590"/><text class="flowLabel" x="1210" y="582">F13</text>
  <path class="pair" d="M1200 840 V875"/><text class="flowLabel" x="1210" y="863">F14</text>
  <path class="flow" d="M840 840 V875"/><text class="flowLabel" x="850" y="863">F15</text>

  <!-- Cross-cutting-store clarifications -->
  <rect x="300" y="980" width="1320" height="125" rx="8" fill="#f8fbfd" stroke="#d7e0e7"/>
  <text class="note" x="325" y="1005">CROSS-CUTTING DATA FLOWS</text>
  <text class="flowLabel" x="325" y="1030">F12</text><text class="note" x="365" y="1030">CDRA profile versions, review/verification decisions, and source evidence → D3, D6, D8</text>
  <text class="flowLabel" x="325" y="1054">F13</text><text class="note" x="365" y="1054">Incident/report versions, review/verification decisions, and source evidence → D4, D5, D6, D8</text>
  <text class="flowLabel" x="325" y="1078">F14</text><text class="note" x="365" y="1078">SitRep source snapshot, review/approval package, version, and release status ↔ D7</text>
  <text class="flowLabel" x="325" y="1102">F15</text><text class="note" x="365" y="1102">Every state-changing process writes actor, action, record/version, state transition, time, and reason → D9</text>

  <text class="note" x="70" y="1132">The full field-level dictionary and mandate/source mapping are in 02_context_and_dfd_specification.md. No external entity connects directly to a data store.</text>
</svg>

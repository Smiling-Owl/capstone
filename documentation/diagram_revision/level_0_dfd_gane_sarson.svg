<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1200" viewBox="0 0 1920 1200">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#244b68" stroke-width="1.7"/>
    </marker>
    <style>
      .title{font:700 38px Inter,Arial,sans-serif;fill:#0e1a2f}
      .sub{font:400 17px Inter,Arial,sans-serif;fill:#526074}
      .entity{fill:#e8f3fb;stroke:#133d5a;stroke-width:2}
      .entityText{font:700 16px Inter,Arial,sans-serif;fill:#133d5a;text-anchor:middle}
      .process{fill:#fdfefe;stroke:#1c557e;stroke-width:2}
      .processRule{stroke:#9fb9cc;stroke-width:1}
      .pid{font:700 14px Inter,Arial,sans-serif;fill:#1c557e}
      .pname{font:600 16px Inter,Arial,sans-serif;fill:#0e1a2f;text-anchor:middle}
      .store{fill:#f5fafd;stroke:#293f50;stroke-width:2}
      .sid{font:700 13px Inter,Arial,sans-serif;fill:#15334a}
      .sname{font:400 13px Inter,Arial,sans-serif;fill:#15334a}
      .flow{fill:none;stroke:#244b68;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
      .pair{fill:none;stroke:#244b68;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-start:url(#arrow);marker-end:url(#arrow)}
      .flowLabel{font:600 12px Inter,Arial,sans-serif;fill:#183a52}
      .labelBg{fill:#fff;opacity:.94}
      .note{font:400 12px Inter,Arial,sans-serif;fill:#576779}
      .lane{fill:#f7fafc;stroke:#d7e0e7;stroke-width:1}
    </style>
  </defs>

  <rect width="1920" height="1200" fill="#f7fafc"/>
  <text class="title" x="48" y="56">Level 0 Data Flow Diagram</text>
  <text class="sub" x="48" y="88">Disaster Situation Record Management and Situation Report Generation System · mandate-aligned Gane–Sarson notation</text>
  <rect x="40" y="115" width="1840" height="1035" rx="14" fill="#fff" stroke="#d7e0e7"/>

  <rect class="lane" x="285" y="145" width="1150" height="250" rx="10"/>
  <text class="note" x="305" y="170">ACCESS, ACCOUNT AUTHORITY, AND CDRA BASELINE</text>
  <rect class="lane" x="285" y="410" width="1150" height="255" rx="10"/>
  <text class="note" x="305" y="435">BOTTOM-UP INCIDENT REPORTING, REVIEW, AND VERIFICATION</text>
  <rect class="lane" x="645" y="685" width="790" height="260" rx="10"/>
  <text class="note" x="665" y="710">SITREP OUTPUT, RECORD RETRIEVAL, AND ACCOUNTABILITY</text>

  <!-- Confirmed external entities -->
  <g id="entity-purok">
    <rect class="entity" x="70" y="455" width="210" height="72"/>
    <text class="entityText" x="175" y="497">PUROK USER</text>
  </g>
  <g id="entity-barangay">

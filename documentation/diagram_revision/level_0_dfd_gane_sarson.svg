    <text class="sid" x="700" y="626">D5</text><text class="sname" x="745" y="618">Purok and Barangay</text><text class="sname" x="745" y="635">Report Versions</text>
  </g>
  <g id="store-d6">
    <path class="store" d="M1050 590 H1350 M1050 650 H1350 M1050 590 V650 M1092 590 V650"/>
    <text class="sid" x="1060" y="626">D6</text><text class="sname" x="1105" y="618">Review and Verification</text><text class="sname" x="1105" y="635">Decisions</text>
  </g>
  <g id="store-d9">

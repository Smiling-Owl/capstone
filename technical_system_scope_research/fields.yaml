fields:
  - category: "Technical purpose"
    definitions:
      - name: "technical_issue"
        description: "The specific adviser question or ambiguity this item resolves in the Scope and Limitations section."
        detail_level: "moderate"
      - name: "minimum_architecture_claim"
        description: "The least implementation-specific architecture statement that can be made before a final technology stack is documented."
        detail_level: "detailed"
  - category: "Execution"
    definitions:
      - name: "runtime_and_deployment_requirements"
        description: "Where the system and its components run, what client devices need, and the distinction among development, evaluation, pilot, and production deployments."
        detail_level: "detailed"
      - name: "installation_and_operation"
        description: "How configuration, database setup, application startup, normal requests, background work, health checks, restart, and maintenance should be described without inventing an unselected stack."
        detail_level: "detailed"
      - name: "dependencies_and_failure_conditions"
        description: "Electricity, connectivity, hosting, HTTPS, browser, storage, external service, device, and personnel dependencies and their failure behavior."
        detail_level: "detailed"
  - category: "Controls and records"
    definitions:
      - name: "security_privacy_and_tenancy"
        description: "Relevant authentication, server-side authorization, organization separation, transport, storage, audit, support-access, and privacy constraints."
        detail_level: "detailed"
      - name: "data_records_and_recovery"
        description: "Provenance, versions, attachments, retention, export, backup, restoration, recovery objectives, and authorized disposition requirements."
        detail_level: "detailed"
      - name: "operator_and_owner"
        description: "The roles responsible for hosting, accounts, updates, backups, incident response, support, records custody, and official decisions."
        detail_level: "moderate"
  - category: "Boundaries"
    definitions:
      - name: "human_decision_boundary"
        description: "What the software may calculate or organize and what still requires an authorized human or external authority."
        detail_level: "detailed"
      - name: "explicit_exclusions"
        description: "Functions, integrations, operating conditions, accuracy, availability, scale, compliance, and outcome guarantees that the prototype must not claim."
        detail_level: "detailed"
      - name: "evaluation_evidence"
        description: "Devices, browsers, datasets, network conditions, concurrency, recovery, accessibility, security, and acceptance criteria required to support a claim."
        detail_level: "detailed"
      - name: "recommended_thesis_wording"
        description: "Concise, academically cautious wording suitable for direct adaptation into the Scope and Limitations section."
        detail_level: "detailed"
  - category: "Evidence"
    definitions:
      - name: "authoritative_sources"
        description: "Primary standards, official Philippine sources, and official technical documentation with URLs and a note identifying the supported proposition."
        detail_level: "detailed"
uncertain: []
